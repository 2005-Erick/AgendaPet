<div class="bg-surface border border-outline-variant rounded-lg p-4 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:scale-[0.99]">
    <div class="flex justify-between items-center mb-2">
        <h4 class="font-bold">{{titulo()}} - {{nomeAnimal()}}</h4>

        <span class="text-sm font-medium px-2 py-1 rounded-md transition-all"
            [style.color]="status() === 'Pendente' ? '#f87171' : ''"
            [style.background]="status() === 'Pendente' ? 'rgba(239,68,68,0.12)' : ''">
            @if (status() === 'Pendente') {
                Atrasado
            } @else {
                {{data()}}
            }
             
        </span>
    </div>

    <p class="text-sm text-on-surface-variant mb-3">
        {{descricao()}}
    </p>

    @if (status() === 'Pendente'){ 
        <button class="px-4 h-8 rounded-lg text-sm font-medium border transition-all" style="border-color:#ef4444;color:#f87171;background:rgba(239,68,68,0.08)">
            Marcar como concluído 
        </button> 
    }
</div>
