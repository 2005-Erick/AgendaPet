<div class="group relative overflow-hidden bg-gradient-to-br from-surface-container to-surface-container-high border border-outline-variant/50 rounded-2xl p-5 flex flex-col gap-5 transition-all duration-300 hover:border-primary/30  hover:shadow-lg hover:shadow-black/10 hover:-translate-y-0.5">
    <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent pointer-events-none rounded-2xl">
    </div>

    <div class="relative flex items-center justify-between gap-4">

        <div class="flex items-center gap-4 min-w-0">

            <div class="relative w-16 h-16 rounded-2xl overflow-hidden border border-outline-variant/50 shrink-0">

                <img class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                    [src]="imagem()" />

                <div class="absolute inset-0 bg-gradient-to-t from-black/15 to-transparent">
                </div>
            </div>

            <div class="min-w-0">
                <h3 class="text-lg font-semibold text-on-surface tracking-tight truncate">

                    {{nome()}}
                </h3>

                <p class="text-sm text-on-surface-variant mt-0.5 truncate">

                    {{raca()}} • {{idade()}}
                </p>
            </div>
        </div>

        <span
            class="shrink-0 bg-secondary-fixed/90 text-on-secondary-fixed px-3 py-1 rounded-full text-[11px] font-semibold tracking-wide uppercase border border-white/10 shadow-sm">
            {{status()}}

        </span>
    </div>

    <div class="relative flex justify-between items-center border-t border-outline-variant/40 pt-3">

        <div class="flex flex-col">
            <span class="text-[11px] uppercase tracking-wide text-on-surface-variant/70">

                Próximo atendimento
            </span>

            <span class="text-sm font-medium text-on-surface">

                {{proximo()}}
            </span>
        </div>

        <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center text-primary transition-all duration-300 group-hover:bg-primary group-hover:text-white">
            <span class="material-symbols-outlined text-[20px]">
                chevron_right
            </span>
        </div>
    </div>
</div>
