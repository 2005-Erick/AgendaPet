<main class="flex flex-col md:flex-row w-full min-h-screen bg-surface selection:bg-primary selection:text-on-primary">
  <!-- Left Side: Image Canvas (Hidden on Mobile) -->
  <section class="hidden md:flex md:w-1/3 relative bg-surface-container-low overflow-hidden items-center justify-center">
    <img alt="Veterinary Clinic" class="absolute inset-0 w-full h-full object-cover opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6QJoP8jPJ-aaVFUkx6BRGOvqN8d4MVwp_-PXpVJIVtFGmnAFkUaY6MCspwpq_ioJhahFwBLPf9Zorb_MVzFkSeY_6BnaKq2ZKO7dAE3AwSwjtdAZ22Np4Ght3D1T9qNcC_NarCBDFP5r5IxL1SJSq51E1WLqKmpq15mqnz7qQSp8efMEu4SUP1Xkn4oN8E19Jj8rNohe8XV-bjdBj7PBm7FsnU1m2_x49BLBBkFp1NzWcH0VqjfASH-WRncbTUVFWt4K2DXfj1ro"/>
    <div class="absolute inset-0 bg-gradient-to-tr from-primary/30 to-transparent mix-blend-multiply"></div>
    <div class="absolute top-10 left-10 z-10 flex items-center gap-2">
      <span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1; font-size: 32px;">pets</span>
      <span class="font-headline-md text-headline-md text-on-primary font-bold tracking-tight">AgendaPet</span>
    </div>
  </section>

  <!-- Right Side: Form Canvas -->
  <section class="flex w-full md:w-2/3 items-center justify-center p-4 md:p-10 bg-surface relative z-10 overflow-y-auto">
    <div class="w-full max-w-[600px] flex flex-col py-8">
      <!-- Mobile Branding -->
      <div class="md:hidden flex items-center justify-center gap-2 mb-8">
        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1; font-size: 32px;">pets</span>
        <span class="font-headline-md text-headline-md text-primary font-bold tracking-tight">AgendaPet</span>
      </div>

      <!-- Header -->
      <header class="mb-8 text-center md:text-left">
        <h1 class="text-3xl font-bold text-on-surface mb-2">Crie sua conta</h1>
        <p class="text-on-surface-variant">Junte-se ao AgendaPet e gerencie a saúde dos seus pets ou pacientes.</p>
      </header>

      @if (errorMessage()) {
        <div class="bg-error-container text-on-error-container p-4 rounded-lg mb-6 text-sm">
          {{ errorMessage() }}
        </div>
      }

      <!-- Form -->
      <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Name -->
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-outline" for="name">Nome Completo</label>
            <input formControlName="name" class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface focus:border-primary focus:border-2 focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="name" placeholder="João Silva" type="text"/>
          </div>

          <!-- Email -->
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-outline" for="email">E-mail</label>
            <input formControlName="email" class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface focus:border-primary focus:border-2 focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="email" placeholder="joao@exemplo.com" type="email"/>
          </div>

          <!-- CPF -->
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-outline" for="cpf">CPF</label>
            <input formControlName="cpf" class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface focus:border-primary focus:border-2 focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="cpf" placeholder="000.000.000-00" type="text"/>
          </div>

          <!-- Birthday -->
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-outline" for="birthday">Data de Nascimento</label>
            <input formControlName="birthday" class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface focus:border-primary focus:border-2 focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="birthday" type="date"/>
          </div>

          <!-- Phone -->
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-outline" for="phone">Telefone</label>
            <input formControlName="phone" class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface focus:border-primary focus:border-2 focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="phone" placeholder="(83) 99999-9999" type="text"/>
          </div>

          <!-- Role -->
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-outline" for="role">Tipo de Perfil</label>
            <select formControlName="role" class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface focus:border-primary focus:border-2 focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="role">
              @for (role of roles; track role.value) {
                <option [value]="role.value">{{ role.label }}</option>
              }
            </select>
          </div>
        </div>

        @if (registrationForm.get('role')?.value === 'DOCTOR') {
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-outline" for="crmv">CRMV</label>
            <input formControlName="crmv" class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface focus:border-primary focus:border-2 focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="crmv" placeholder="12345-PB" type="text"/>
          </div>
        }

        <!-- Password -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold uppercase tracking-wider text-outline" for="password">Senha</label>
          <input formControlName="password" class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface focus:border-primary focus:border-2 focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
        </div>

        <!-- Submit Button -->
        <button 
          [disabled]="registrationForm.invalid || isLoading()"
          class="w-full h-12 mt-4 bg-primary text-on-primary rounded-lg font-bold flex justify-center items-center hover:bg-primary-container disabled:opacity-50 transition-colors shadow-md" 
          type="submit">
          {{ isLoading() ? 'Cadastrando...' : 'Criar Minha Conta' }}
        </button>
      </form>

      <!-- Login Link -->
      <p class="mt-8 text-center text-sm text-on-surface-variant">
        Já tem uma conta?
        <a class="font-bold text-primary hover:underline" routerLink="/login">Fazer Login</a>
      </p>
    </div>
  </section>
</main>
